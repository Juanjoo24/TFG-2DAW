<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Mi Perfil | ZapaJuan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(rgba(14, 14, 18, 0.78), rgba(20, 20, 26, 0.88)), 
                url('https://images.unsplash.com/photo-1750590357126-1bc50096df82?fm=jpg&q=60&w=3000');

    background-size: cover;
    background-position: center;
    background-attachment: fixed; 
    background-repeat: no-repeat;
    min-height: 100vh;
    color: #ffffff;
}

.profile-card {
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(24, 24, 30, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

h2 {
    color: white;
    letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(139, 90, 43, 0.2);
}

.avatar {
    font-size: 85px;
    color: #8B5A2B; /* Marrón ZapaJuan */
    filter: drop-shadow(0 0 15px rgba(139, 90, 43, 0.3));
}

.form-control {
    border-radius: 12px;
    padding: 12px 14px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: #ffffff;
    transition: all 0.3s ease;
}

.form-control::placeholder {
    color: #777;
}

.form-control:focus {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    border-color: #8B5A2B; 
    box-shadow: 0 0 15px rgba(139, 90, 43, 0.25);
}

/* LABELS */
.form-label {
    font-weight: 600;
    font-size: 0.9rem;
    color: #ddd;
}

.form-label i {
    color: #8B5A2B; 
    margin-right: 4px;
}

/* ALERTA PERSONALIZADA */
.alert-success {
    background: rgba(25, 135, 84, 0.2);
    border: 1px solid rgba(25, 135, 84, 0.3);
    color: #4dd4ac;
    border-radius: 12px;
}

.btn-primary {
    background: #8B5A2B; 
    border: none;
    border-radius: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 14px;
    transition: all 0.2s ease;
}

.btn-primary:hover {
    background: #704822; 
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(139, 90, 43, 0.3);
}

.btn-back {
    border-radius: 12px;
    font-weight: 600;
    padding: 10px 22px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.05);
    color: white;
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s;
}

.btn-back:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.4);
    color: white;
}

.container {
    padding-top: 50px;
    padding-bottom: 50px;
}

</style>

</head>

<body>

<div class="container">

    <h2 class="text-center fw-bold mb-4 text-uppercase">
        <i class="bi bi-person-circle" style="color: #8B5A2B !important;"></i> Mi Perfil
    </h2>

    <div class="card profile-card mx-auto p-4" style="max-width:650px;">

        <div class="text-center mb-4">
            <i class="bi bi-person-circle avatar"></i>
            <h5 class="mt-3 fw-bold text-white" th:text="${nombreUsuario}">Usuario</h5>
            <p class="text-muted small">Cuenta de cliente ZapaJuan</p>
        </div>

        <div th:if="${param.exito}" class="alert alert-success shadow-sm mb-4">
            <i class="bi bi-check-circle-fill me-2"></i> ¡Cambios guardados con éxito!
        </div>

        <form id="perfilForm" th:action="@{/perfil/guardar}" method="post" novalidate>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-person"></i> Nombre</label>
                    <input type="text" id="nombre-input" class="form-control" name="nombre" th:value="${nombre}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label"><i class="bi bi-person-badge"></i> Apellido</label>
                    <input type="text" id="apellido-input" class="form-control" name="apellido" th:value="${apellido}" required>
                </div>

            </div>

            <div class="mt-3">
                <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
                <input type="email" id="email-input" class="form-control" name="email" th:value="${email}" required>
            </div>

            <div class="mt-3">
                <label class="form-label"><i class="bi bi-lock"></i> Nueva contraseña</label>
                <input type="password" id="password-input" class="form-control" name="password" placeholder="••••••••">
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-save"></i> Guardar cambios
                </button>
            </div>

        </form>

        <div class="text-center mt-4">
            <a th:href="@{/bienvenida}" class="btn btn-back">
                <i class="bi bi-arrow-left"></i> Volver a la tienda
            </a>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/perfil.js?v=3}"></script>
</body>
</html>
