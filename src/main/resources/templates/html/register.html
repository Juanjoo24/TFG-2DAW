<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="/css/form.css">
    
    <title>Registrarse - ZapaJuan</title>
    <style>
        body {      
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=1450&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        
        .register-card {
            width: 100%;
            max-width: 480px; 
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .input-custom {
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 10px 14px;
            color: #1a1a1a;
            background-color: #ffffff;
        }
        
        .input-custom:focus {
            border-color: #1a1a1a;
            box-shadow: none;
        }
        
        .btn-custom-dark {
            background-color: #1a1a1a;
            color: #ffffff;
            border-radius: 6px;
            padding: 12px;
            border: none;
        }
        
        .btn-custom-dark:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .link-login {
            color: #dc3545;
        }
        .link-login:hover {
            color: #bd2130;
            text-decoration: underline;
        }
        .link-back {
            color: #6c757d;
        }
        .link-back:hover {
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    
    <div class="main-wrapper">
        <header class="mb-4">
            <a href="/">
                <img src="/imagenes/logoTienda.png" alt="Logo ZapaJuan" style="height: 80px; width: auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));">
            </a>
        </header>
        
        <div class="card register-card">
            <div class="card-body p-4 p-md-5">
                <h2 class="card-title text-center mb-2 fw-bold text-dark text-uppercase" style="letter-spacing: 1px;">Crear Cuenta</h2>
                <p class="text-center text-muted small mb-4">Únete a la comunidad de ZapaJuan</p>
                
                <form id="registroForm" th:action="@{/usuarios/registrar}" th:object="${usuarioForm}" method="post" novalidate>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control input-custom" placeholder="Tu nombre" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">Apellido</label>
                        <input type="text" id="apellido" th:field="*{apellido}" class="form-control input-custom" placeholder="Tu apellido" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control input-custom" placeholder="Email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">Nombre de Usuario</label>
                        <input type="text" id="usuario" th:field="*{usuario}" class="form-control input-custom" placeholder="Elige tu usuario" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small">Contraseña</label>
                        <input type="password" id="contrasena" th:field="*{contrasena}" class="form-control input-custom" placeholder="••••••••" required>
                        <div id="passMensaje" class="small mt-1 fw-bold"></div>
                    </div>

                    <button type="submit" class="btn btn-custom-dark w-100 fw-bold text-uppercase">Registrar</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0 small text-muted">¿Ya tienes cuenta? 
                        <a href="/login" class="link-login text-decoration-none fw-bold ms-1">Inicia sesión</a>
                    </p>
                    <hr class="my-4 opacity-25" style="color: #000;">
                    <a href="/" class="link-back text-decoration-none small fw-medium">
                        <i class="bi bi-arrow-left me-1"></i> Volver a la tienda
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/register.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
