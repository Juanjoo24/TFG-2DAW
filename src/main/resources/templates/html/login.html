<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" th:href="@{/css/form.css}">
    
    <title>Iniciar Sesión - ZapaJuan</title>
    <style>
        body {      
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=1450&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .input-group-custom {
            border: 1px solid #ced4da;
            border-radius: 6px;
            overflow: hidden;
            background-color: #ffffff;
        }
        
        .input-group-custom:focus-within {
            border-color: #1a1a1a;
        }
        
        .input-group-custom .form-control {
            border: none;
            padding: 12px 12px 12px 0;
            color: #1a1a1a !important;
            box-shadow: none !important;
        }

        .input-group-custom .form-control::placeholder {
            color: #6c757d;
        }
        
        .input-group-custom .input-group-text {
            background: transparent;
            border: none;
            color: #495057;
            padding-left: 14px;
            padding-right: 10px;
        }
        
        .btn-custom-dark {
            background-color: #1a1a1a;
            color: #ffffff;
            border-radius: 6px;
            padding: 12px;
            border: none;
        }
        
        .btn-custom-dark:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .link-register {
            color: #dc3545;
        }
        .link-register:hover {
            color: #bd2130;
            text-decoration: underline !important;
        }
        .link-back {
            color: #6c757d !important;
        }
        .link-back:hover {
            color: #1a1a1a !important;
        }
    </style>
</head>
<body>
    
    <div class="main-wrapper">
        <!-- Logo de la tienda -->
        <header class="mb-4">
            <a th:href="@{/}" class="d-inline-block">
                <img th:src="@{/imagenes/logoTienda.png}" alt="Logo ZapaJuan" style="height: 80px; width: auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));">
            </a>
        </header>
        
        <!--  Formulario -->
        <div class="card login-card">
            <div class="card-body p-4 p-md-5">
                <h2 class="card-title text-center mb-2 fw-bold text-dark text-uppercase" style="letter-spacing: 1px;">Bienvenido</h2>
                <p class="text-center text-muted small mb-4">Introduce tus credenciales para acceder</p>
                
                <form th:action="@{/login}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">Nombre de Usuario</label>
                        <div class="input-group-custom d-flex align-items-center">
                            <span class="input-group-text"><i class="bi bi-person fs-5"></i></span>
                            <input type="text" name="username" class="form-control bg-transparent" placeholder="Tu usuario" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small">Contraseña</label>
                        <div class="input-group-custom d-flex align-items-center">
                            <span class="input-group-text"><i class="bi bi-lock fs-5"></i></span>
                            <input type="password" name="password" class="form-control bg-transparent" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom-dark w-100 fw-bold text-uppercase">Entrar</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0 small text-muted">¿No tienes una cuenta? 
                        <a th:href="@{/register}" class="link-register text-decoration-none fw-bold ms-1">Regístrate aquí</a>
                    </p>
                    <hr class="my-4 opacity-25" style="color: #000;">
                    <a th:href="@{/}" class="link-back text-decoration-none small fw-medium">
                        <i class="bi bi-arrow-left me-1"></i> Volver a la tienda</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
