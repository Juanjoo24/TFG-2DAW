<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <title>ZapaJuan - Finalizar Compra</title>
    <style>
		body {
		    margin: 0;
		    font-family: sans-serif;
		    background: linear-gradient(rgba(14, 14, 18, 0.75), rgba(20, 20, 26, 0.85)), 
		                url('https://images.unsplash.com/photo-1750590357126-1bc50096df82?fm=jpg&q=60&w=3000');
		    background-size: cover;
		    background-position: center;
		    background-attachment: fixed;
		    min-height: 100vh;
		}

		.card {
		    border: none;
		    border-radius: 20px;
		    background: rgba(255, 255, 255, 0.95);
		    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
		    color: #1a1a1a;
		}

		.form-control {
		    border-radius: 12px;
		    padding: 12px;
		    border: 1px solid #ddd;
		    margin-bottom: 15px;
		    transition: all 0.3s ease;
		}

		.form-control:focus {
		    border-color: #8B5A2B;
		    box-shadow: 0 0 10px rgba(139, 90, 43, 0.2);
		}

		.total-price {
		    font-size: 2.2rem;
		    color: #1a1a1a;
		    font-weight: 800;
		    display: block;
		    margin: 20px 0;
		}

		.btn-pay {
		    padding: 16px;
		    border-radius: 12px;
		    background-color: #8B5A2B;
		    border: none;
		    color: white;
		    width: 100%;
		    font-weight: 800;
		    text-transform: uppercase;
		    cursor: pointer;
		}

		.btn-pay:hover {
		    background-color: #704822;
		    transform: translateY(-2px);
		}

		.back-link {
		    display: block;
		    text-align: center;
		    margin-top: 20px;
		    color: #666;
		    font-weight: 600;
		    text-decoration: none;
		}

		.back-link:hover {
		    color: #8B5A2B;
		}

		.btn-delete {
		    color: #ff4d4d;
		    background: none;
		    border: none;
		    font-size: 1.2rem;
		    cursor: pointer;
		}
	</style>
</head>
<body>
    <div class="container py-5">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card p-4 mb-4">
                    <h4 class="fw-bold mb-4 text-uppercase">Tu Cesta</h4>
                    <table class="table table-borderless align-middle">
                        <tbody id="lista-carrito"></tbody>
                    </table>
                </div>

                <div class="card p-4">
                    <h4 class="fw-bold mb-4 text-uppercase">Datos de Envío</h4>
                    <form id="form-registro" novalidate>
                        <input type="email" id="email-input" class="form-control" placeholder="Correo electrónico" required>
                        <input type="text" id="direccion-input" class="form-control" placeholder="Dirección de entrega" required>
                        <div class="row g-2">
							<input type="text" inputmode="numeric" pattern="[0-9]{16}" id="tarjeta-input" class="form-control" placeholder="Nº Tarjeta" maxlength="16" required>
                            <div class="col-6"><input type="text" id="fecha-input" class="form-control" placeholder="MM/AA" required></div>
                            <div class="col-6"><input type="password" id="cvc-input" class="form-control" placeholder="CVC" required></div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card p-4 sticky-top" style="top: 20px;">
                    <h4 class="fw-bold text-uppercase">Resumen</h4>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Envío</span>
                        <span class="text-success fw-bold">GRATIS</span>
                    </div>
                    <hr>
                    <div class="text-center">
                        <span id="total" class="total-price">0.00€</span>
                    </div>
                    <button type="submit" form="form-registro" class="btn-pay">FINALIZAR Y PAGAR</button>
                    <a th:href="@{/}" class="back-link">VOLVER A LA TIENDA</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/checkout.js}"></script>
</body>
</html>
